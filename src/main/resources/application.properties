spring.application.name=Smart-Clinic-Management
server.port=8080

# ===== MySQL (JPA) =====
spring.datasource.url=jdbc:mysql://localhost:3306/cms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Sample data (data.sql) =====
# Run once with "always", then change to "never" to avoid duplicates
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===== MongoDB =====
spring.mongodb.uri=mongodb://localhost:27017/prescriptions_db